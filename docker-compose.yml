services:
  api:
    build:
      context: .
      dockerfile: DockerFile
    container_name: haulage-node-api
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - .env
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
      REDIS_URL: redis://redis:6379
      ROUTING_ENGINE_URL: http://routing-engine:8000
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      routing-engine:
        condition: service_started
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"

  routing-engine:
    build:
      context: ./routing-engine
      dockerfile: Dockerfile
    container_name: haulage-routing-engine
    ports:
      - "${ROUTING_PORT:-8001}:8000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: DockerFile
    container_name: haulage-closed-loop-worker
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
      REDIS_URL: redis://redis:6379
      ROUTING_ENGINE_URL: http://routing-engine:8000
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      routing-engine:
        condition: service_started
    command: npm run worker

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: haulage-redis
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: haulage-qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6335}:6333"
      - "${QDRANT_GRPC_PORT:-6336}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  redis_data:
  qdrant_data: